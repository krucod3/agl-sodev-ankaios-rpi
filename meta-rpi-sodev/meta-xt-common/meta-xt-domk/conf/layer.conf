# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Wrynose-visible DomD integration recipes.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# The guest image requires AGL's image recipes and is exposed only when aglcore
# is present. The Ankaios adjustment likewise appears only beside meta-ankaios.
BBFILES_DYNAMIC += " \
    aglcore:${LAYERDIR}/dynamic-layers/agl-core/recipes-*/*/*.bb \
    aglcore:${LAYERDIR}/dynamic-layers/agl-core/recipes-*/*/*.bbappend \
    meta-ankaios:${LAYERDIR}/dynamic-layers/meta-ankaios/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "xt-domk"
BBFILE_PATTERN_xt-domk := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-domk = "8"

LAYERDEPENDS_xt-domk = "core"
LAYERSERIES_COMPAT_xt-domk = "scarthgap wrynose"
