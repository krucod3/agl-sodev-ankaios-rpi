[Service]
# Do not enumerate DRM heads until their mode lists have stopped changing.
#
# HDMI-A-2's panel delivers its EDID 3.7 s late (measured), which makes the kernel
# rebuild that connector's mode list after weston has already enabled the output.
# weston does not re-read it ("Detected a monitor change on head 'HDMI-A-2', not
# bothering to do anything about it") and every atomic commit then fails with
# EINVAL, leaving the panel dark for the rest of the session. See the header of
# weston-wait-drm-modes for the full measurement and why weston.ini's pinned
# modeline does not cover this case.
#
# The helper is bounded and always exits 0, so it can only delay weston, never
# prevent it from starting. 98-no-watchdog.conf's TimeoutStartSec=120 covers the
# 25 s ceiling plus weston's own start-up.
ExecStartPre=/usr/libexec/weston-wait-drm-modes

# Then decide, against the settled mode lists, whether each head can actually use
# the modeline weston.ini pins on it. The pin is correct for the two reference
# panels and wrong for every ordinary monitor, which has no 1920x720 mode; forcing
# it there fails the atomic commit and the display stays on fbcon for the whole
# session. The helper only overrides a head that has an EDID AND does not advertise
# the pinned resolution, so on both verified benches it is a no-op -- see its header.
#
# Ordering matters and comes from the order of these two lines inside this one file:
# the selector must see the mode lists the wait helper settled. Do not move it into
# a separate drop-in, where filename collation would decide instead.
#
# `+` runs it as root: weston.service is User=weston and this writes
# /etc/xdg/weston/weston.ini in place. `+` also exempts this one command from
# User=/ProtectSystem=/ReadOnlyPaths= (systemd.service(5)) without relaxing them for
# weston itself. It always exits 0, so like the wait helper it can only delay weston.
ExecStartPre=+/usr/libexec/weston-select-drm-modes
